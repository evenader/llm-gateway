# 本地演示配置：配合 scripts/run_mock_upstream.py 使用（mock 固定 127.0.0.1:9001）。
# 上游 Key 使用演示专用环境变量 DEMO_UPSTREAM_KEY（占位值即可），与真实 DEEPSEEK_API_KEY 完全隔离。
server: {host: 127.0.0.1, port: 8010}
auth: {enabled: false, keys_env: GATEWAY_API_KEYS}
retry: {max_retries: 3, base_delay_s: 0.5, factor: 2.0, max_delay_s: 8.0, jitter: full}
stream: {heartbeat_interval_s: 15}
structured: {max_repairs: 2}
defaults:
  timeout: {connect_s: 5, read_s: 60, total_s: 120}
  rate_limit: {rate_per_s: 5, burst: 10}
observability: {enabled: true, db_path: data/demo/observability.db, queue_size: 10000}
prompts: {db_path: data/demo/prompts.db, seed_dir: config/prompts}
models:
  deepseek-v4-pro:
    protocol: openai_responses
    base_url: http://127.0.0.1:9001
    endpoint_path: /responses
    api_key_env: DEMO_UPSTREAM_KEY
    upstream_model: deepseek-v4-pro
    rate_limit: {rate_per_s: 100, burst: 100}
    capabilities: {stream: true, native_json_object: true, native_json_schema: true}
    thinking: disabled
  deepseek-v4-flash:
    protocol: anthropic_messages
    base_url: http://127.0.0.1:9001/anthropic
    endpoint_path: /v1/messages
    api_key_env: DEMO_UPSTREAM_KEY
    upstream_model: deepseek-v4-flash
    default_max_tokens: 4096
    rate_limit: {rate_per_s: 100, burst: 100}
    capabilities: {stream: true, native_json_object: false, native_json_schema: false}
    thinking: disabled
  demo-limited:
    protocol: anthropic_messages
    base_url: http://127.0.0.1:9001/anthropic
    endpoint_path: /v1/messages
    api_key_env: DEMO_UPSTREAM_KEY
    upstream_model: deepseek-v4-flash
    default_max_tokens: 1024
    rate_limit: {rate_per_s: 0.2, burst: 2}
    capabilities: {stream: true, native_json_object: false, native_json_schema: false}
    thinking: disabled
